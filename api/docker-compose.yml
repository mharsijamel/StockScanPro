version: "3.9"

services:
  php-fpm:
    build: ./docker/php
    container_name: php_api_fpm
    volumes:
      - ./:/var/www/html
    networks:
      - apinet

  nginx:
    image: nginx:latest
    container_name: php_api_nginx
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - php-fpm
    networks:
      - apinet

networks:
  apinet:
    driver: bridge
