name: stock_app
description: A new Flutter project to interact with Odoo.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Pour les appels HTTP
  http: ^1.1.0
  
  # Pour la gestion d'état (State Management)
  provider: ^6.0.5
  
  # Pour le stockage local simple (persistance du token)
  shared_preferences: ^2.2.0
  
  # Pour la base de données SQLite
  sqflite: ^2.3.0
  path: ^1.8.3

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # For SQLite testing
  sqflite_common_ffi: ^2.3.0

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  # Add assets folder
  assets:
    - assets/images/
    - assets/icons/
